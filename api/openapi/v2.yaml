    NativeAgentFailureDetails:
      additionalProperties: false
      description: Finite safe failure stage and validated counters only. No raw error,
        SQL, provider body, object IDs, connection values or secret. Reserved calls do
        not prove requests arrived; missing usage remains unknown, not free.
      properties:
        failure_protocol:
          enum:
          - zhiyu-agent-failure-v1
          type: string
        failure_reason:
          enum:
          - REJECTED
          - RESERVE_CONFIGURATION
          - RESERVE_INPUT_BYTES
          - RESERVE_CALLS
          - RESERVE_TOKENS
          - RESERVE_COST
          - TOOL_CALLS
          - REPORTED_USAGE
          type: string
        failure_stage:
          enum:
          - BODY_DECODE
          - TURN_DECODE
          - SNAPSHOT_READ
          - SNAPSHOT_VALIDATE
          - INPUT_ENCODE
          - RESERVE
          - PROVIDER_CONFIGURATION
          - PROVIDER
          - PROVIDER_REPLY_SCHEMA
          - PROVIDER_USAGE
          - PROVIDER_ENVELOPE
          - PROVIDER_HTTP_STATUS
          - PROVIDER_RESPONSE
          - USAGE
          - REPLY_DECODE
          - MODEL_TOOL_SCOPE
          - DONE_WITHOUT_OBSERVATION
          - REPEAT_TOOL
          - TOOL_REFERENCE
          - TOOL_LIMIT
          - OBSERVE
          - OBSERVATION_SIZE
          - CONTEXT
          - FRESH_SNAPSHOT
          - FRESH_REFERENCES
          - FINAL_SIZE
          - UNKNOWN
          type: string
        provider_calls_reserved:
          maxLength: 19
          pattern: ^(0|[1-9][0-9]*)$
          type: string
        reserved_cost_micros:
          maxLength: 19
          pattern: ^(0|[1-9][0-9]*)$
          type: string
        reserved_tokens:
          maxLength: 19
          pattern: ^(0|[1-9][0-9]*)$
          type: string
        tool_calls_consumed:
          maxLength: 19
          pattern: ^(0|[1-9][0-9]*)$
          type: string
        usage_scope:
          enum:
          - PARTIAL_UNKNOWN_ATTEMPTS_NOT_INVOICE
          - NO_PROVIDER_RESERVATIONS
          - VALIDATED_RETURNED_REPLIES_ONLY_NOT_INVOICE
          type: string
        validated_input_tokens:
          maxLength: 19
          pattern: ^(0|[1-9][0-9]*)$
          type: string
        validated_output_tokens:
          maxLength: 19
          pattern: ^(0|[1-9][0-9]*)$
          type: string
        validated_reported_calls:
          maxLength: 19
          pattern: ^(0|[1-9][0-9]*)$
          type: string
      required:
      - failure_protocol
      - failure_stage
      - failure_reason
      - provider_calls_reserved
      - tool_calls_consumed
      - reserved_tokens
      - reserved_cost_micros
      - validated_input_tokens
      - validated_output_tokens
      - validated_reported_calls
      - usage_scope
      type: object
