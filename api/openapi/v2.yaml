components:
  securitySchemes:
    BearerAuth: { type: http, scheme: bearer, bearerFormat: opaque-server-session }
    CSRFToken: { type: apiKey, in: header, name: X-CSRF-Token }
  parameters:
    Origin:
      name: Origin
      in: header
      required: true
      description: Must match the server-configured browser origin; local default http://127.0.0.1:5178.
      schema: { type: string, minLength: 1, maxLength: 256 }
  responses:
    Failure:
      description: Typed error; rejection never rewrites old financial originals.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
  schemas:
    ID:
      type: string
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
      minLength: 36
      maxLength: 36
    Money:
      type: string
      description: Canonical integer CNY cents, not yuan or JSON number; Go v1 capacity 0 through 9000000000000000.
      pattern: '^(0|[1-9][0-9]{0,14}|[1-8][0-9]{15}|9000000000000000)$'
      maxLength: 16
      example: '10000'
    Digest: { type: string, pattern: '^[0-9a-f]{64}$', minLength: 64, maxLength: 64 }
    CommandKey: { type: string, minLength: 16, maxLength: 128, pattern: '^[A-Za-z0-9_-]+$' }
    Version: { type: integer, format: int64, minimum: 1 }
    Timestamp: { type: string, format: date-time }
    SessionRequest:
      type: object
      additionalProperties: false
      required: [secret]
      properties:
        secret: { type: string, minLength: 32, maxLength: 128, writeOnly: true }
    Session:
      type: object
      additionalProperties: false
      required: [token, csrf_token, user_id, environment, expires_at]
      properties:
        token: { type: string, pattern: '^[0-9a-f]{64}$' }
        csrf_token: { type: string, pattern: '^[0-9a-f]{64}$' }
        user_id: { $ref: '#/components/schemas/ID' }
        environment: { type: string, minLength: 1, maxLength: 128 }
        expires_at: { $ref: '#/components/schemas/Timestamp' }
    Scope:
      type: object
      additionalProperties: false
      required: [environment_id, user_id, goal_id, source_account_id, destination_account_id, currency]
      properties:
        environment_id: { $ref: '#/components/schemas/ID' }
        user_id: { $ref: '#/components/schemas/ID' }
        goal_id: { $ref: '#/components/schemas/ID' }
        source_account_id: { $ref: '#/components/schemas/ID' }
        destination_account_id: { $ref: '#/components/schemas/ID' }
        currency: { type: string, enum: [CNY] }
    ConfirmationSource:
      type: object
      additionalProperties: false
      description: Server-owned historical source; never accepted from a browser or model.
      required: [id, principal_kind, environment_id, user_id, target_kind, target_id, target_version, reviewed_hash, confirmed_at]
      properties:
        id: { $ref: '#/components/schemas/ID' }
        principal_kind: { type: string, enum: [USER] }
        environment_id: { $ref: '#/components/schemas/ID' }
        user_id: { $ref: '#/components/schemas/ID' }
        target_kind: { type: string, enum: [POLICY, GRANT, PLAN] }
        target_id: { $ref: '#/components/schemas/ID' }
        target_version: { $ref: '#/components/schemas/Version' }
        reviewed_hash: { $ref: '#/components/schemas/Digest' }
        confirmed_at: { $ref: '#/components/schemas/Timestamp' }
        expires_at: { $ref: '#/components/schemas/Timestamp' }
    PolicyStatus: { type: string, enum: [ACTIVE, PAUSED, REVOKED] }
    PolicyRequest:
      type: object
      additionalProperties: false
      required: [goal_id, max_amount]
      properties:
        goal_id: { $ref: '#/components/schemas/ID' }
        max_amount: { $ref: '#/components/schemas/Money' }
        valid_until: { $ref: '#/components/schemas/Timestamp' }
    GrantRequest:
      type: object
      additionalProperties: false
      required: [policy_id, max_amount]
      properties:
        policy_id: { $ref: '#/components/schemas/ID' }
        max_amount: { $ref: '#/components/schemas/Money' }
    Policy:
      type: object
      additionalProperties: false
      required: [id, version, scope, max_amount, monthly_min, monthly_target, monthly_max, valid_from, valid_until, status, confirmation]
      properties:
        id: { $ref: '#/components/schemas/ID' }
        version: { $ref: '#/components/schemas/Version' }
        scope: { $ref: '#/components/schemas/Scope' }
        max_amount: { $ref: '#/components/schemas/Money' }
        monthly_min: { $ref: '#/components/schemas/Money' }
        monthly_target: { $ref: '#/components/schemas/Money' }
        monthly_max: { $ref: '#/components/schemas/Money' }
        timezone: { type: string }
        deadline: { type: string, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' }
        valid_from: { $ref: '#/components/schemas/Timestamp' }
        valid_until: { $ref: '#/components/schemas/Timestamp' }
        status: { $ref: '#/components/schemas/PolicyStatus' }
        confirmation: { $ref: '#/components/schemas/ConfirmationSource' }
    Grant:
      type: object
      additionalProperties: false
      required: [id, version, policy_id, policy_version, scope, max_amount, effective_from, valid_until, status, confirmation]
      properties:
        id: { $ref: '#/components/schemas/ID' }
        version: { $ref: '#/components/schemas/Version' }
        policy_id: { $ref: '#/components/schemas/ID' }
        policy_version: { $ref: '#/components/schemas/Version' }
        scope: { $ref: '#/components/schemas/Scope' }
        max_amount: { $ref: '#/components/schemas/Money' }
        effective_from: { $ref: '#/components/schemas/Timestamp' }
        valid_until: { $ref: '#/components/schemas/Timestamp' }
        status: { $ref: '#/components/schemas/PolicyStatus' }
        confirmation: { $ref: '#/components/schemas/ConfirmationSource' }
    Dependencies:
      type: object
      additionalProperties: false
      required: [funds_version, grant_version, policy_version, product_terms_version, product_availability_version, source_evidence_version, writer_generation, control_version]
      properties:
        funds_version: { $ref: '#/components/schemas/Version' }
        grant_version: { type: integer, format: int64, minimum: 0 }
        policy_version: { $ref: '#/components/schemas/Version' }
        product_terms_version: { $ref: '#/components/schemas/Version' }
        product_availability_version: { $ref: '#/components/schemas/Version' }
        source_evidence_version: { $ref: '#/components/schemas/Version' }
        writer_generation: { $ref: '#/components/schemas/Version' }
        control_version: { $ref: '#/components/schemas/Version' }
    Candidate:
      type: object
      additionalProperties: false
      required: [id, algorithm, kind, policy_id, policy_version, policy_hash, scope, status, amount, max_safe, minimum_shortfall, eligible_income, uses, effective_from, earliest_income_at, prepared_at, valid_until, dependencies, input_hash, effect_hash]
      properties:
        id: { $ref: '#/components/schemas/ID' }
        algorithm: { type: string, enum: [single-goal-go-v1] }
        kind: { type: string, enum: [ALLOCATE_GOAL] }
        policy_id: { $ref: '#/components/schemas/ID' }
        policy_version: { $ref: '#/components/schemas/Version' }
        policy_hash: { $ref: '#/components/schemas/Digest' }
        scope: { $ref: '#/components/schemas/Scope' }
        status: { type: string, enum: [READY, LIQUIDITY_RISK, MINIMUM_SHORTFALL, NO_ACTION] }
        amount: { $ref: '#/components/schemas/Money' }
        max_safe: { $ref: '#/components/schemas/Money' }
        minimum_shortfall: { $ref: '#/components/schemas/Money' }
        eligible_income: { $ref: '#/components/schemas/Money' }
        uses:
          type: array
          maxItems: 100000
          items: { $ref: '#/components/schemas/IncomeUse' }
        effective_from: { $ref: '#/components/schemas/Timestamp' }
        earliest_income_at: { $ref: '#/components/schemas/Timestamp' }
        prepared_at: { $ref: '#/components/schemas/Timestamp' }
        valid_until: { $ref: '#/components/schemas/Timestamp' }
        dependencies: { $ref: '#/components/schemas/Dependencies' }
        input_hash: { $ref: '#/components/schemas/Digest' }
        effect_hash: { $ref: '#/components/schemas/Digest' }
    IncomeUse:
      type: object
      additionalProperties: false
      required: [FragmentID, OriginID, AccountID, Amount]
      description: Current domain IncomeUse has exported Go field names and no JSON tags; this preserves its actual wire shape.
      properties:
        OriginID: { $ref: '#/components/schemas/ID' }
        FragmentID: { $ref: '#/components/schemas/ID' }
        AccountID: { $ref: '#/components/schemas/ID' }
        Amount: { $ref: '#/components/schemas/Money' }
    OperationRequest:
      type: object
      additionalProperties: false
      required: [plan_id, mode]
      properties:
        plan_id: { $ref: '#/components/schemas/ID' }
        grant_id: { $ref: '#/components/schemas/ID' }
        mode: { type: string, enum: [ONCE, STANDING] }
      description: STANDING requires grant_id. ONCE records an authenticated human one-shot confirmation; supplied client authority objects are forbidden.
    OperationState:
      type: string
      enum: [QUEUED, SUBMITTING, PENDING_SETTLEMENT, UNKNOWN, RECONCILING, SETTLED, REJECTED, CANCELLED]
    Operation:
      type: object
      additionalProperties: false
      required: [id, state, amount_cents, plan_id, bank_key, processing_health, created_at, updated_at, version]
      properties:
        id: { $ref: '#/components/schemas/ID' }
        state: { $ref: '#/components/schemas/OperationState' }
        amount_cents: { $ref: '#/components/schemas/Money' }
        plan_id: { $ref: '#/components/schemas/ID' }
        bank_key: { type: string, minLength: 1, maxLength: 256 }
        bank_observed_status: { type: string, enum: [NOT_FOUND, ACCEPTED, SETTLED, REJECTED] }
        processing_health: { type: string }
        receipt_id: { $ref: '#/components/schemas/ID' }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
        version: { $ref: '#/components/schemas/Version' }
      description: SETTLED requires verified bank settlement and one committed local receipt; this cross-field invariant is validated in server domain/application code.
    Account:
      type: object
      additionalProperties: false
      required: [id, name, balance_cents, goal_owned_cents]
      properties:
        id: { $ref: '#/components/schemas/ID' }
        name: { type: string }
        balance_cents: { $ref: '#/components/schemas/Money' }
        goal_owned_cents: { $ref: '#/components/schemas/Money' }
    Goal:
      type: object
      additionalProperties: false
      required: [id, name, account_id, target_cents, assigned_cents]
      properties:
        id: { $ref: '#/components/schemas/ID' }
        name: { type: string }
        account_id: { $ref: '#/components/schemas/ID' }
        target_cents: { $ref: '#/components/schemas/Money' }
        assigned_cents: { $ref: '#/components/schemas/Money' }
    Dashboard:
      type: object
      additionalProperties: false
      required: [environment, as_of, accounts, goals, policies, grants, operations, verification_scope, projection]
      properties:
        environment: { type: string, minLength: 1, maxLength: 128 }
        as_of: { $ref: '#/components/schemas/Timestamp' }
        accounts: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/Account' } }
        goals: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/Goal' } }
        policies: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/Policy' } }
        grants: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/Grant' } }
        operations: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/Operation' } }
        verification_scope: { type: string, enum: [DISPLAY_SNAPSHOT] }
        projection: { $ref: '#/components/schemas/ProjectionWatermark' }
    ProjectionWatermark:
      type: object
      additionalProperties: false
      required: [source_sequence, applied_sequence, status]
      properties:
        source_sequence: { type: integer, format: int64, minimum: 0 }
        applied_sequence: { type: integer, format: int64, minimum: 0 }
        projected_at: { $ref: '#/components/schemas/Timestamp' }
        status: { type: string, enum: [CURRENT, DELAYED, INVALID, MISSING] }
    Activity:
      type: object
      additionalProperties: false
      required: [id, kind, aggregate_id, aggregate_version, created_at]
      properties:
        id: { $ref: '#/components/schemas/ID' }
        kind: { type: string, minLength: 1 }
        aggregate_id: { $ref: '#/components/schemas/ID' }
        aggregate_version: { type: integer, format: int64, minimum: 1 }
        created_at: { $ref: '#/components/schemas/Timestamp' }
    ActivityPage:
      type: object
      additionalProperties: false
      required: [items, as_of, total, returned, has_more, verification_scope]
      properties:
        items: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/Activity' } }
        next_cursor: { type: string, maxLength: 2048 }
        as_of: { $ref: '#/components/schemas/Timestamp' }
        total: { type: integer, format: int64, minimum: 0 }
        returned: { type: integer, minimum: 0, maximum: 100 }
        has_more: { type: boolean }
        verification_scope: { type: string, enum: [ACTIVITY_MEMBERSHIP_SNAPSHOT] }
    AgentStatus:
      $ref: '#/components/schemas/NativeAgentStatus'
