openapi: 3.0.3
info:
  title: Zhiyu isolated simulated funds API
  version: 2.0.0-r4
  description: >-
    Transport contract for ALLOCATE_GOAL, native template previews/lifecycles, forecast and captured audits. Domain permissions,
    clocks, income facts, requests and settlement are determined by server code.
    Generated types do not validate authentication, authority or financial effects.
servers:
  - url: http://127.0.0.1:19310
security:
  - BearerAuth: []
paths:
  /api/v2/session:
    post:
      operationId: createSession
      summary: Authenticate with a configured local synthetic user's code
      security: []
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessionRequest' }
      responses:
        '200':
          description: Server determines user and environment; no client user_id accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        default: { $ref: '#/components/responses/Failure' }
  /api/v2/dashboard:
    get:
      operationId: getDashboard
      summary: Bounded display snapshot; never an execution permission
      responses:
        '200':
          description: Owned current facts with at most 100 items per fact list and 20 operations.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dashboard' }
        default: { $ref: '#/components/responses/Failure' }
  /api/v2/activities:
    get:
      operationId: getActivities
      summary: Bounded opaque activity membership snapshot with a scoped expiring cursor
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: cursor
          in: query
          schema: { type: string, maxLength: 2048 }
      responses:
        '200':
          description: Immutable first-page event watermark, deterministic created_at/id order, limit plus one. No payload or full evidence is constructed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivityPage' }
        default: { $ref: '#/components/responses/Failure' }
  /api/v2/projections/rebuild:
    post:
      operationId: rebuildDisplayProjection
      summary: Repair only derived display records from retained ordered source events
      security: [{ BearerAuth: [], CSRFToken: [] }]
      parameters: [{ $ref: '#/components/parameters/Origin' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        '200':
          description: No financial command, reservation, bank call or authoritative balance is changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectionWatermark' }
        default: { $ref: '#/components/responses/Failure' }
  /api/v2/policies:
    post:
      operationId: confirmPolicy
      summary: Explicit USER confirmation of one goal policy
      security: [{ BearerAuth: [], CSRFToken: [] }]
      parameters: [{ $ref: '#/components/parameters/Origin' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PolicyRequest' }
      responses:
        '201':
          description: Immutable reviewed policy version.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Policy' }
        default: { $ref: '#/components/responses/Failure' }
  /api/v2/grants:
    post:
      operationId: confirmGrant
      summary: Explicit USER standing authorization; model cannot confirm
      security: [{ BearerAuth: [], CSRFToken: [] }]
      parameters: [{ $ref: '#/components/parameters/Origin' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GrantRequest' }
      responses:
        '201':
          description: Immutable standing grant with server confirmation source.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Grant' }
        default: { $ref: '#/components/responses/Failure' }
  /api/v2/grants/{grant_id}/revoke:
    post:
      operationId: revokeGrant
      summary: Stop new use of a grant without erasing unresolved original operations
      security: [{ BearerAuth: [], CSRFToken: [] }]
      parameters:
        - $ref: '#/components/parameters/Origin'
        - name: grant_id
          in: path
          required: true
          schema: { $ref: '#/components/schemas/ID' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        '204':
          description: Revocation completed; independently reload grants and keep in-flight original reconciliation.
        default: { $ref: '#/components/responses/Failure' }
  /api/v2/plans:
    post:
      operationId: createPlan
      summary: Plan against current trusted facts; no bank effect
      security: [{ BearerAuth: [], CSRFToken: [] }]
      parameters: [{ $ref: '#/components/parameters/Origin' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [policy_id]
              properties:
                policy_id: { $ref: '#/components/schemas/ID' }
      responses:
        '201':
          description: Frozen candidate. A non-READY candidate grants no execution eligibility.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Candidate' }
        default: { $ref: '#/components/responses/Failure' }
  /api/v2/operations:
    post:
      operationId: acceptOperation
      summary: T1 accepts the immutable original command and reservation
      description: >-
        Save environment, user, plan, complete body and key before the first POST.
        Reuse the same key/body after a lost response and query command-results.
        HTTP 202 never implies bank settlement or local journal completion.
      security: [{ BearerAuth: [], CSRFToken: [] }]
      parameters:
        - $ref: '#/components/parameters/Origin'
        - name: Idempotency-Key
          in: header
          required: true
          schema: { $ref: '#/components/schemas/CommandKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OperationRequest' }
      responses:
        '202':
          description: Original operation; read its authoritative state and receipt separately.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Operation' }
        default: { $ref: '#/components/responses/Failure' }
  /api/v2/operations/{operation_id}:
    get:
      operationId: getOperation
      summary: Read one owned authoritative operation
      parameters:
        - name: operation_id
          in: path
          required: true
          schema: { $ref: '#/components/schemas/ID' }
      responses:
        '200':
          description: Current original operation; UNKNOWN and ACCEPTED retain uncertainty.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Operation' }
        default: { $ref: '#/components/responses/Failure' }
  /api/v2/command-results/{command_key}:
    get:
      operationId: getCommandResult
      summary: Recover the same owned command after an HTTP response is lost
      parameters:
        - name: command_key
          in: path
          required: true
          schema: { $ref: '#/components/schemas/CommandKey' }
      responses:
        '200':
          description: Same original operation; a 404 is not final evidence of no effect.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Operation' }
        default: { $ref: '#/components/responses/Failure' }
  /api/v2/agent/status:
    get:
      operationId: getAgentStatus
      summary: Read isolated provider availability without contacting a provider
      responses:
        '200':
          description: OFFLINE and NOT_RUN when no explicit new provider configuration exists.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentStatus' }
        default: { $ref: '#/components/responses/Failure' }
  /api/v2/agent/turn:
    post:
      operationId: runAgentTurn
      summary: Read owned objects or produce a conditional typed candidate; never confirm
        or execute
      description: Scope comes from the authenticated USER session. Thirteen registered
        closed tools read current owned evidence or return an IF_USER_CONFIRMED template
        candidate. OFFLINE never contacts a model. MODEL has text only, configured provider
        and original duration/call/token/cost limits. Native grant tools, data, references
        and derived collection digests are OFFLINE-only and never enter provider payloads
        or MODEL results. References are re-read before returning. No observation or
        candidate grants authority.
      security:
      - BearerAuth: []
        CSRFToken: []
      parameters:
      - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentTurn'
      responses:
        '200':
          description: Current display observations and optional unconfirmed form draft.
            No bank effect.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResult'
        '400':
          description: Bounded safe Agent failure labels and validated counters; unknown
            usage is not an invoice or zero cost.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NativeAgentError'
        '409':
          description: Bounded safe Agent failure labels and validated counters; unknown
            usage is not an invoice or zero cost.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NativeAgentError'
        '429':
          description: Bounded safe Agent failure labels and validated counters; unknown
            usage is not an invoice or zero cost.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NativeAgentError'
        '503':
          description: Bounded safe Agent failure labels and validated counters; unknown
            usage is not an invoice or zero cost.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NativeAgentError'
        '504':
          description: Bounded safe Agent failure labels and validated counters; unknown
            usage is not an invoice or zero cost.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NativeAgentError'
        default:
          $ref: '#/components/responses/Failure'
  /api/v2/goals:
    post:
      operationId: createGoal
      summary: createGoal
      responses:
        '201':
          description: Authoritative scoped result; configuration and preview do not
            grant bank authority.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NativeAppGoalDetail'
        default:
          $ref: '#/components/responses/Failure'
      parameters:
      - $ref: '#/components/parameters/Origin'
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
          minLength: 64
          maxLength: 64
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          $ref: '#/components/schemas/CommandKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NativeAppGoalConfigurationRequest'
  /api/v2/goals/{goal_id}:
    get:
      operationId: getGoal
      summary: getGoal
      responses:
        '200':
          description: Authoritative scoped result; configuration and preview do not
            grant bank authority.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NativeAppGoalDetail'
        default:
          $ref: '#/components/responses/Failure'
      parameters:
      - name: goal_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ID'
    post:
      operationId: updateGoal
      summary: updateGoal
      responses:
        '200':
          description: Authoritative scoped result; configuration and preview do not
            grant bank authority.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NativeAppGoalDetail'
        default:
          $ref: '#/components/responses/Failure'
      parameters:
      - name: goal_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ID'
      - $ref: '#/components/parameters/Origin'
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
          minLength: 64
          maxLength: 64
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          $ref: '#/components/schemas/CommandKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NativeAppGoalConfigurationRequest'
  /api/v2/template-policy-previews:
    post:
      operationId: previewTemplatePolicy
      summary: previewTemplatePolicy
      responses:
        '201':
          description: Authoritative scoped result; configuration and preview do not
            grant bank authority.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NativeAppTemplatePolicyPreview'
        default:
          $ref: '#/components/responses/Failure'
      parameters:
      - $ref: '#/components/parameters/Origin'
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
          minLength: 64
          maxLength: 64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NativeAppTemplatePolicyRequest'
  /api/v2/template-policies:
    get:
      operationId: listTemplatePolicies
      summary: listTemplatePolicies
      responses:
        '200':
          description: Authoritative scoped result; configuration and preview do not
            grant bank authority.
          content:
            application/json:
              schema:
                type: array
                maxItems: 100
                items:
                  $ref: '#/components/schemas/NativeAppTemplatePolicyView'
        default:
          $ref: '#/components/responses/Failure'
    post:
      operationId: confirmTemplatePolicy
      summary: confirmTemplatePolicy
      responses:
        '201':
          description: Authoritative scoped result; configuration and preview do not
            grant bank authority.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NativeAppTemplatePolicyView'
        default:
          $ref: '#/components/responses/Failure'
      parameters:
      - $ref: '#/components/parameters/Origin'
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
          minLength: 64
          maxLength: 64
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          $ref: '#/components/schemas/CommandKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NativeAppTemplatePolicyConfirmation'
  /api/v2/template-policies/{policy_id}:
    get:
      operationId: getTemplatePolicy
      summary: getTemplatePolicy
      responses:
        '200':
          description: Authoritative scoped result; configuration and preview do not
            grant bank authority.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NativeAppTemplatePolicyView'
        default:
          $ref: '#/components/responses/Failure'
      parameters:
      - name: policy_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ID'
  /api/v2/template-policy-versions/{version_id}:
    get:
      operationId: getTemplatePolicyVersion
      summary: getTemplatePolicyVersion
      responses:
        '200':
          description: Authoritative scoped result; configuration and preview do not
            grant bank authority.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NativeAppTemplatePolicyView'
        default:
          $ref: '#/components/responses/Failure'
      parameters:
      - name: version_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ID'
  /api/v2/template-policies/{policy_id}/state:
    post:
      operationId: setTemplatePolicyState
      summary: setTemplatePolicyState
      responses:
        '200':
          description: Authoritative scoped result; configuration and preview do not
            grant bank authority.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NativeAppTemplatePolicyView'
        default:
          $ref: '#/components/responses/Failure'
      parameters:
      - name: policy_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ID'
      - $ref: '#/components/parameters/Origin'
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
          minLength: 64
          maxLength: 64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NativeTemplateStateRequest'
  /api/v2/forecast:
    get:
      operationId: getForecast
      summary: getForecast
      responses:
        '200':
          description: Authoritative scoped result; configuration and preview do not
            grant bank authority.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NativeAppForecastView'
        default:
          $ref: '#/components/responses/Failure'
      parameters:
      - name: horizon_days
        in: query
        schema:
          type: integer
          minimum: 0
          maximum: 365
          default: 365
      - name: timezone
        in: query
        schema:
          type: string
          enum:
          - UTC
          - Asia/Shanghai
          default: Asia/Shanghai
  /api/v2/forecast/refresh-protection:
    post:
      operationId: refreshForecastProtection
      summary: refreshForecastProtection
      responses:
        '200':
          description: Authoritative scoped result; configuration and preview do not
            grant bank authority.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NativeAppForecastView'
        default:
          $ref: '#/components/responses/Failure'
      parameters:
      - $ref: '#/components/parameters/Origin'
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
          minLength: 64
          maxLength: 64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
  /api/v2/audits:
    post:
      operationId: createAudit
      summary: createAudit
      responses:
        '202':
          description: Authoritative scoped result; configuration and preview do not
            grant bank authority.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NativeAppAuditRun'
        default:
          $ref: '#/components/responses/Failure'
      parameters:
      - $ref: '#/components/parameters/Origin'
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
          minLength: 64
          maxLength: 64
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          $ref: '#/components/schemas/CommandKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NativeAppAuditRequest'
  /api/v2/audits/{audit_id}:
    get:
      operationId: getAudit
      summary: getAudit
      responses:
        '200':
          description: Authoritative scoped result; configuration and preview do not
            grant bank authority.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NativeAppAuditRun'
        default:
          $ref: '#/components/responses/Failure'
      parameters:
      - name: audit_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ID'
  /api/v2/audit-anchors:
    post:
      operationId: importAuditAnchor
      summary: importAuditAnchor
      responses:
        '201':
          description: Authoritative scoped result; configuration and preview do not
            grant bank authority.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NativeAppAuditAnchor'
        default:
          $ref: '#/components/responses/Failure'
      parameters:
      - $ref: '#/components/parameters/Origin'
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
          minLength: 64
          maxLength: 64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NativeAppAuditAnchorRequest'
  /api/v2/audits/{audit_id}/artifacts/{kind}:
    get:
      operationId: getAuditArtifact
      summary: Download exact retained JSON bytes; protocol versions in the artifact
        govern verification
      responses:
        '200':
          description: Authoritative scoped result; configuration and preview do not
            grant bank authority.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
          headers:
            X-Artifact-SHA256:
              schema:
                $ref: '#/components/schemas/Digest'
              description: SHA256 of exact retained response bytes
            X-Captured-Manifest-SHA256:
              schema:
                $ref: '#/components/schemas/Digest'
              description: Canonical captured manifest digest, distinct from the response
                byte hash
        default:
          $ref: '#/components/responses/Failure'
      parameters:
      - name: audit_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ID'
      - name: kind
        in: path
        required: true
        schema:
          type: string
          enum:
          - capture
          - result
  /api/v2/joint-plans:
    post:
      operationId: previewJointPlan
      responses:
        '201':
          description: Scoped original result. Accepted operations remain unsettled
            until their bank and local receipt agree.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NativeAppNativeJointView'
        default:
          $ref: '#/components/responses/Failure'
      parameters:
      - $ref: '#/components/parameters/Origin'
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
          minLength: 64
          maxLength: 64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NativeAppJointPlanRequest'
  /api/v2/joint-plans/{plan_id}:
    get:
      operationId: getJointPlan
      responses:
        '200':
          description: Scoped original result. Accepted operations remain unsettled
            until their bank and local receipt agree.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NativeAppNativeJointView'
        default:
          $ref: '#/components/responses/Failure'
      parameters:
      - name: plan_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ID'
  /api/v2/joint-operations:
    post:
      operationId: acceptJointOperations
      responses:
        '202':
          description: Scoped original result. Accepted operations remain unsettled
            until their bank and local receipt agree.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NativeAppNativeOperationGroup'
        default:
          $ref: '#/components/responses/Failure'
      parameters:
      - $ref: '#/components/parameters/Origin'
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
          minLength: 64
          maxLength: 64
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          $ref: '#/components/schemas/CommandKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NativeAppNativeJointCommand'
  /api/v2/joint-operations/{group_id}:
    get:
      operationId: getJointOperations
      responses:
        '200':
          description: Scoped original result. Accepted operations remain unsettled
            until their bank and local receipt agree.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NativeAppNativeOperationGroup'
        default:
          $ref: '#/components/responses/Failure'
      parameters:
      - name: group_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ID'
  /api/v2/joint-commands/{key}:
    get:
      operationId: getJointCommand
      responses:
        '200':
          description: Scoped original result. Accepted operations remain unsettled
            until their bank and local receipt agree.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NativeAppNativeOperationGroup'
        default:
          $ref: '#/components/responses/Failure'
      parameters:
      - name: key
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/CommandKey'
  /api/v2/joint-operations/{group_id}/resume:
    post:
      operationId: resumeJointOriginal
      responses:
        '200':
          description: Scoped original result. Accepted operations remain unsettled
            until their bank and local receipt agree.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NativeAppNativeOperationGroup'
        default:
          $ref: '#/components/responses/Failure'
      parameters:
      - name: group_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ID'
      - $ref: '#/components/parameters/Origin'
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
          minLength: 64
          maxLength: 64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
  /api/v2/bridge-previews:
    post:
      operationId: previewBridge
      responses:
        '201':
          description: Scoped original result. Accepted operations remain unsettled
            until their bank and local receipt agree.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NativeAppNativeBridgePreview'
        default:
